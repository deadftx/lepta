<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Microsoft Authentication - Lepta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="background:#0b0f17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden;">
  <div style="text-align:center;padding:20px;">
    <div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.15);border-top-color:#ff4b4b;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px;"></div>
    <p style="margin:0;font-size:0.95rem;font-weight:500;">Autenticando na Microsoft...</p>
    <p style="margin:6px 0 0;font-size:0.8rem;color:#888;">Esta janela será fechada automaticamente.</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
