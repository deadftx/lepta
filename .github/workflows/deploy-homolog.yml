name: Deploy to Homolog

on:
  push:
    branches:
      - HOMOLOG

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/lepta
            # Atualiza o código
            git fetch --all
            git reset --hard origin/HOMOLOG
            git pull origin HOMOLOG

            # O banco é persistente e pertence à VPS; nunca deve vir do Git.
            # Interrompe o deploy antes do restart se o arquivo estiver ausente,
            # evitando que a aplicação crie acidentalmente uma base vazia.
            test -f /var/www/lepta/database.sqlite || { echo "ERRO: database.sqlite da VPS não encontrado"; exit 1; }
            
            # Instala dependências e gera o build
            npm install
            npm run build

            # Mantém instalado o backup diário da API UNLTD às 07:30 (São Paulo).
            bash scripts/install-unltd-sync-timer.sh
            
            # Reinicia o servidor
            pm2 restart lepta-homolog
